# Spec 5.8 release manifest schema (YAML). Working-channel seed for v0.1.0.
# required lists fields that MUST be present. format notes 40-char SHAs
# and sha256: prefixes. Values may still be TODO until promotion (spec 16.7).
$schema: "https://json-schema.org/draft/2020-12/schema"
title: <Company> company-agent release manifest
type: object
additionalProperties: false
required:
  - release_id
  - created_at
  - distribution_git_sha
  - platform_git_sha
  - agency_agents_git_sha
  - hermes_image_digest
  - knowledge_image_digest
  - policy_bundle_sha256
  - skills_manifest_sha256
  - plugins_manifest_sha256
  - distribution_tree_sha256
  - eval_suite_version
  - database_schema_revision
  - approved_by
properties:
  release_id:
    type: string
    pattern: "^company-agent-v"
  created_at:
    type: string
    format: date-time
  distribution_git_sha:
    type: string
  platform_git_sha:
    type: string
  agency_agents_git_sha:
    type: string
  hermes_image_digest:
    type: string
  knowledge_image_digest:
    type: string
  policy_bundle_sha256:
    type: string
  skills_manifest_sha256:
    type: string
  plugins_manifest_sha256:
    type: string
  distribution_tree_sha256:
    type: string
    description: >
      Spec 36.6 integrity digest. SHA-256 hex of the distribution tree:
      every regular file under the distribution root, sorted by relative
      path, excluding .git/, the release manifest being verified, and
      tests/VALIDATION-*.txt (recorded run output).
    pattern: "^[a-f0-9]{64}$"
  eval_suite_version:
    type: string
  database_schema_revision:
    type: string
  approved_by:
    type: array
    items:
      type: string
    minItems: 2
