# Specialist wrapper catalog
# Spec 18.2 (router pin), 18.6 (curated packs), 18.7 (wrapper format),
# Appendix A (first roster), Phase 4 §4490.
# D041 (first specialist roster) is open — wrappers below are the proposed
# Phase 4 business roster with TODO pins, not an approved production set.
# Existing legal.document-review wrapper is preserved.

router:
  id: agency-agents-router
  source:
    repository: https://github.com/msitarzewski/agency-agents.git
    commit: "TODO: <REVIEWED_40_CHARACTER_COMMIT_SHA>"
    license: MIT
    integration: hermes
  reviewed_at: TODO
  reviewed_by:
    - "TODO: <REVIEWER_1>"
    - "TODO: <REVIEWER_2>"
  install:
    generated_plugin: plugins/agency-agents-router
    strategy: internal-artifact-from-pinned-sha
    note: Do not clone arbitrary upstream HEAD onto user workstations (spec 18.5).
  documentation: specialists/ROUTER.md

wrappers:
  # --- Contract / legal (existing; do not rename) ---
  - id: legal.document-review
    domain: contract
    pack: legal-compliance
    source:
      repository: msitarzewski/agency-agents
      slug: "TODO: <UPSTREAM_SLUG>  # D041"
      commit: "TODO: <PINNED_SHA>  # D041"
    policy_overlay: specialists/overlays/legal-document-review.yaml
    tool_allowlist:
      - kb_search
      - kb_get_document
      - contract_get
      - contract_create_internal_review
    tool_denylist:
      - contract_sign
      - payment_create
      - external_message_send
    record_scope:
      read: [contract, legal_matter, vendor]
      write: [review_finding, draft_redline]
    approval_gates:
      first_pass_review: automatic
      create_internal_draft: automatic
      send_redline: legal_approval_required
      sign: forbidden

  - id: legal.compliance-checker
    domain: contract
    pack: legal-compliance
