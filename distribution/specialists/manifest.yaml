    tool_allowlist:
      - kb_search
      - kb_get_document
      - contract_get
    tool_denylist:
      - contract_sign
      - payment_create
      - privilege_change
      - external_message_send
    record_scope:
      read: [contract, policy, legal_matter]
      write: [compliance_finding]
    approval_gates:
      first_pass_review: automatic
      issue_external_opinion: legal_approval_required
      waive_requirement: forbidden

